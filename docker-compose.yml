version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    image: aurorys-labs-web:latest
    container_name: aurorys-labs-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # If placing behind NGINX or Traefik, network them here.
